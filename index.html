<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d16" />
    <meta name="description" content="Choisir sa place dans un restaurant en 3D, sur écran ou en réalité virtuelle." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Restaurant XR — réservation immersive</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        overflow: hidden;
        background: #0d0d16;
        font-family: system-ui, sans-serif;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #status {
        position: absolute;
        top: 18px;
        left: 18px;
        max-width: min(58ch, 52vw);
        color: #fff;
        background: rgba(0, 0, 0, 0.72);
        padding: 10px 15px;
        border-radius: 6px;
        z-index: 100;
        font-size: 14px;
        line-height: 1.45;
        pointer-events: none;
      }
      #panel {
        position: absolute;
        left: 18px;
        bottom: 18px;
        z-index: 100;
        width: min(360px, 34vw);
      }
      #table-card {
        position: absolute;
        top: 18px;
        right: 18px;
        bottom: 96px;
        z-index: 120;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        pointer-events: none;
      }
      #view-toggle {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 110;
      }
      #table-card > * { pointer-events: auto; }
      
      /* === AJOUT : Auth Overlay === */
      #auth-root {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: rgba(13, 13, 22, 0.9); backdrop-filter: blur(4px);
      }
      .auth-panel {
        background: #1a1a24; padding: 32px; border-radius: 12px;
        border: 1px solid #333; color: white;
        display: flex; flex-direction: column; gap: 16px; width: 340px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .auth-panel h2 { margin: 0 0 8px 0; font-size: 20px; text-align: center; }
      .auth-panel input {
        padding: 12px; border-radius: 6px; border: 1px solid #444;
        background: #0d0d16; color: white; font-size: 14px;
      }
      .auth-panel input:focus { outline: none; border-color: #22c55e; }
      .auth-panel button {
        padding: 12px; border-radius: 6px; border: none;
        background: #22c55e; color: black; font-weight: bold;
        cursor: pointer; transition: background 0.2s; font-size: 14px;
      }
      .auth-panel button:hover { background: #16a34a; }
      #auth-error { color: #ef4444; font-size: 13px; margin: 0; text-align: center; min-height: 16px; }
      /* ======================== */

      @media (max-width: 720px) {
        #panel { width: calc(100vw - 36px); }
        #table-card { inset: auto 12px 12px 12px; bottom: 12px; top: auto; }
      }
    </style>
  </head>
  <body>
    <!-- === AJOUT : Conteneur Auth === -->
    <div id="auth-root"></div>
    
    <div id="app"></div>
    <div id="status">Pointez une table et appuyez sur la gâchette</div>
    <div id="panel"></div>
    <div id="view-toggle"></div>
    <div id="table-card"></div>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/main.mjs"></script>
  </body>
</html>
