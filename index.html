<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant XR — réservation immersive</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #0d0d16;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      #status {
        position: absolute;
        top: 18px;
        left: 18px;
        max-width: min(58ch, 52vw);
        color: #fff;
        background: rgba(0, 0, 0, 0.72);
        padding: 10px 15px;
        border-radius: 6px;
        z-index: 100;
        font-size: 14px;
        line-height: 1.45;
        pointer-events: none;
      }
      #panel {
        position: absolute;
        left: 18px;
        bottom: 18px;
        z-index: 100;
        width: min(360px, 34vw);
      }
      @media (max-width: 720px) {
        #panel {
          width: calc(100vw - 36px);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">Pointez une table et appuyez sur la gâchette</div>
    <div id="panel"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
