<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aperçu du lieu — Restaurant XR</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0d16;
        overflow: hidden;
      }
      #hint {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 10;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.7);
        color: #e8e8f0;
        font: 12px/1.5 ui-monospace, monospace;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hint">aperçu WebGL — molette pour zoomer, glisser pour tourner</div>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      import { addLighting, createScene } from '../src/core/scene.mjs';
      import { buildRestaurant } from '../src/world/restaurant.mjs';

      // Ce fichier existe uniquement pour la vérification visuelle : l'application
      // tourne en WebGPU seul, et le rendu WebGPU ne produit aucune frame en headless.
      // Ici on rend le MÊME monde avec un WebGLRenderer, depuis le même build Three.js.
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      document.body.appendChild(renderer.domElement);
      renderer.domElement.style.width = '100%';
      renderer.domElement.style.height = '100%';

      const { scene, camera } = createScene();
      addLighting(scene);
      scene.add(buildRestaurant().restaurant);

      // Points de vue nommés : ?view=salle | rue | terrasse | mezzanine | bar
      const VIEWS = {
        salle: { pos: [0, 1.7, 5.5], target: [0, 1.4, -2] },
        rue: { pos: [0, 2.2, 22], target: [0, 3.2, 7] },
        terrasse: { pos: [3.5, 1.6, 13], target: [-1, 1.4, 8] },
        mezzanine: { pos: [-2.5, 4.9, -2.5], target: [1.5, 2.6, 3] },
        bar: { pos: [4, 1.7, 2.5], target: [10.5, 1.4, 1.5] },
        entree: { pos: [7, 1.75, 1.6], target: [7, 2.2, 7] },
        'nave-large': { pos: [0, 1.8, 6.6], target: [0, 3.2, -3] },
      };

      const view = new URLSearchParams(window.location.search).get('view') ?? 'salle';
      const { pos, target } = VIEWS[view] ?? VIEWS.salle;
      camera.position.set(...pos);
      camera.lookAt(...target);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(...target);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.update();

      const params = new URLSearchParams(window.location.search);
      const hint = document.getElementById('hint');
      hint.textContent = `aperçu WebGL — vue « ${view} »`;
      if (params.get('hud') === '0') hint.style.display = 'none';

      // Le rendu logiciel (swiftshader) est très lent sur cette scène : on rend quelques
      // images puis on arrête, sinon une capture headless ne se termine jamais.
      const MAX_FRAMES = Number(new URLSearchParams(window.location.search).get('frames') ?? 4);
      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
        window.__previewFrames = (window.__previewFrames ?? 0) + 1;
        if (window.__previewFrames >= MAX_FRAMES) renderer.setAnimationLoop(null);
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight, false);
      });
    </script>
  </body>
</html>
