<script type="module">
  import { PROFILES, TABLES, RESERVATIONS } from './mock-data.mjs';

  // Deep-ish clone so tests can mutate without polluting the fixture
  const db = {
    profiles: structuredClone(PROFILES),
    tables: structuredClone(TABLES),
    reservations: structuredClone(RESERVATIONS),
  };

  const listeners = [];
  function emitChange(payload) {
    listeners.forEach((l) => l(payload));
  }

  function makeQuery(tableName) {
    const filters = [];
    let insertRow = null;
    let orderBy = null;

    const query = {
      select() { return query; },
      eq(col, val) { filters.push([col, val]); return query; },
      order(col, { ascending = true } = {}) { orderBy = [col, ascending]; return query; },
      maybeSingle() {
        const rows = apply();
        return Promise.resolve({ data: rows[0] ?? null, error: null });
      },
      single() {
        const rows = apply();
        return Promise.resolve({ data: rows[0] ?? null, error: null });
      },
      insert(row) {
        insertRow = row;
        return query;
      },
      then(resolve) {
        if (insertRow) {
          const created = { id: db[tableName].length + 1, created_at: new Date().toISOString(), status: 'confirmed', ...insertRow };
          db[tableName].push(created);
          emitChange({ eventType: 'INSERT', new: created, table: tableName });
          return Promise.resolve({ data: created, error: null }).then(resolve);
        }
        return Promise.resolve({ data: apply(), error: null }).then(resolve);
      },
    };

    function apply() {
      let rows = db[tableName].slice();
      for (const [col, val] of filters) rows = rows.filter((r) => r[col] === val);
      if (orderBy) {
        const [col, asc] = orderBy;
        rows.sort((a, b) => (a[col] > b[col] ? 1 : a[col] < b[col] ? -1 : 0) * (asc ? 1 : -1));
      }
      return rows;
    }

    return query;
  }

  window.__mockSupabase = {
    from: (name) => makeQuery(name),
    auth: {
      getUser: async () => ({ data: { user: { id: PROFILES[0].id, email: 'slim@example.com' } }, error: null }),
      signInWithPassword: async ({ email }) => ({
        data: { user: { id: PROFILES[0].id, email } },
        error: null,
      }),
      signUp: async ({ email }) => ({
        data: { user: { id: PROFILES[0].id, email } },
        error: null,
      }),
      signOut: async () => ({ error: null }),
    },
    channel: (name) => ({
      on: (_event, _filter, cb) => {
        listeners.push(cb);
        return { subscribe: () => {} };
      },
    }),
    removeChannel: () => {},
  };
</script>
